<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- FHIR Network Mesh Heart -->
  <g stroke="url(#meshGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 58 L10 36 C4 29 4 17 14 11 C23 6 29 12 32 16 C35 12 41 6 50 11 C60 17 60 29 54 36 Z" fill="none" stroke-width="2.8" />
    <line x1="32" y1="16" x2="18" y2="22" />
    <line x1="32" y1="16" x2="46" y2="22" />
    <line x1="18" y1="22" x2="32" y2="34" />
    <line x1="46" y1="22" x2="32" y2="34" />
    <line x1="18" y1="22" x2="14" y2="36" />
    <line x1="46" y1="22" x2="50" y2="36" />
    <line x1="14" y1="36" x2="32" y2="48" />
    <line x1="50" y1="36" x2="32" y2="48" />
    <line x1="32" y1="34" x2="32" y2="48" />
  </g>

  <!-- Network Nodes -->
  <g fill="#00ffcc" filter="url(#glow)">
    <circle cx="32" cy="16" r="3.2" />
    <circle cx="18" cy="22" r="2.8" />
    <circle cx="46" cy="22" r="2.8" />
    <circle cx="14" cy="36" r="2.8" />
    <circle cx="50" cy="36" r="2.8" />
    <circle cx="32" cy="34" r="3" />
    <circle cx="32" cy="48" r="3" />
  </g>

  <!-- Dynamic Medical Pulse Waveform (Full Bleed across canvas) -->
  <path d="M2 33 L13 33 L17 25 L23 43 L32 7 L40 50 L46 27 L50 33 L62 33" 
        fill="none" 
        stroke="#00e5ff" 
        stroke-width="4.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />
  <path d="M2 33 L13 33 L17 25 L23 43 L32 7 L40 50 L46 27 L50 33 L62 33" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="1.8" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>